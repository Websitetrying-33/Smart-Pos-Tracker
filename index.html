<div class="summary-split-grid">
                    <div class="summary-card-rice">
                        <h4 id="lblSplitRice">🌾 Bigasan Net Cash</h4>
                        <div class="val" id="splitRiceVal">₱0.00</div>
                    </div>
                    <div class="summary-card-gcash">
                        <h4 id="lblSplitGcash">📱 GCash Net Fee</h4>
                        <div class="val" id="splitGCashVal">₱0.00</div>
                    </div>
                </div>

                <div class="overall-box">
                    <h3 id="lblCombinedHeader">KABUUANG KITA NG TINDAHAN (COMBINED)</h3>
                    <div class="profit-value" id="overallProfit">₱0.00</div>
                </div>

                <div class="btn-group" style="margin-top: 10px; justify-content: center;">
                    <button class="btn btn-dark" onclick="window.print()" id="btnPrint">🖨️ Print Report</button>
                    <button class="btn btn-danger" onclick="resetAllData()" id="btnReset">🗑️ Reset All</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Container para sa Toast Notifications -->
    <div id="toastContainer"></div>

    <script>
        let currentLang = localStorage.getItem("pos_lang") || "tl";

        const translations = {
            tl: {
                switchBtn: "Switch to English",
                headerTitle: "🌾 SMART POS & STORE TRACKER 🌾",
                headerSub: "Capital Recovery Mode - Auto SMS Listener Connected",
                smsWaiting: "📱 Node.js Server: Waiting for SMS...",
                riceHeader: "🌾 Bigasan Sales & Inventory Tracker 🌾",
                addRiceBtn: "+ Add Rice Variety",
                thName: "Uri ng Bigas 🌾",
                thBought: "Binili 🌾",
                thCost: "Puhunan/Sako 🌾",
                thSold: "Nabenta 🌾",
                thPrice: "Presyo/Sako 🌾",
                thRem: "Natira 🌾",
                thTotCost: "Tot Puhunan 🌾",
                thTotSales: "Tot Benta 🌾",
                thProfit: "Profit / Loss 🌾",
                thStatus: "Status 🌾",
                thAction: "Action 🌾",
                riceSummaryTitle: "🌾 Summary ng Bigasan (Capital Recovery Method):",
                sumCost: "Kabuuang Inilabas na Puhunan (Lahat ng Binili):",
                sumSales: "Kabuuang Pumasok na Benta:",
                sumNet: "Net Cash Flow (Profit / Loss):",
                dlRice: "📥 Download Rice Excel",
                clrRice: "🧹 Clear Rice",
                gcashHeader: "📱 GCash Transactions Tracker",
                addGcashBtn: "+ Add",
                cashInVol: "Cash In Vol:",
                cashOutVol: "Cash Out Vol:",
                gcashFeeSum: "📊 Summary ng GCash Only (Kita sa Fee):",
                historyHeader: "🔍 GCash History Log (Auto-Updated via SMS):",
                thTime: "Oras",
                thType: "Type",
                thAmt: "Amount",
                thFee: "Fee",
                thRef: "Ref No.",
                dlGcash: "📥 Download GCash Excel",
                overallHeader: "📊 Overall Store Summary",
                splitRice: "🌾 Bigasan Net Cash",
                splitGcash: "📱 GCash Net Fee",
                combinedHeader: "KABUUANG KITA NG TINDAHAN (COMBINED)",
                printRep: "🖨️ Print Report",
                resetAll: "🗑️ Reset All",
                deleteBtn: "Delete",
                placeholderName: "Pangalan ng Bigas"
            },
            en: {
                switchBtn: "Tagalog",
                headerTitle: "🌾 SMART POS & STORE TRACKER 🌾",
                headerSub: "Capital Recovery Mode - Auto SMS Listener Connected",
                smsWaiting: "📱 Node.js Server: Waiting for SMS...",
                riceHeader: "🌾 Rice Sales & Inventory Tracker 🌾",
                addRiceBtn: "+ Add Rice Variety",
                thName: "Rice Variety 🌾",
                thBought: "Bought 🌾",
                thCost: "Cost/Sack 🌾",
                thSold: "Sold 🌾",
                thPrice: "Sell/Sack 🌾",
                thRem: "Rem 🌾",
                thTotCost: "Tot Cost 🌾",
                thTotSales: "Tot Sales 🌾",
                thProfit: "Profit / Loss 🌾",
                thStatus: "Status 🌾",
                thAction: "Action 🌾",
                riceSummaryTitle: "🌾 Rice Summary (Capital Recovery Method):",
                sumCost: "Total Capital Outlay (All Bought):",
                sumSales: "Total Sales Collected:",
                sumNet: "Net Cash Flow (Profit / Loss):",
                dlRice: "📥 Download Rice Excel",
                clrRice: "🧹 Clear Rice",
                gcashHeader: "📱 GCash Transactions Tracker",
                addGcashBtn: "+ Add",
                cashInVol: "Cash In Vol:",
                cashOutVol: "Cash Out Vol:",
                gcashFeeSum: "📊 Summary of GCash Only (Fee Earned):",
                historyHeader: "🔍 GCash History Log (Auto-Updated via SMS):",
                thTime: "Time",
                thType: "Type",
                thAmt: "Amount",
                thFee: "Fee",
                thRef: "Ref No.",
                dlGcash: "📥 Download GCash Excel",
                overallHeader: "📊 Overall Store Summary",
                splitRice: "🌾 Rice Net Cash",
                splitGcash: "📱 GCash Net Fee",
                combinedHeader: "TOTAL STORE PROFIT (COMBINED)",
                printRep: "🖨️ Print Report",
                resetAll: "🗑️ Reset All",
                deleteBtn: "Delete",
                placeholderName: "Rice Brand Name"
            }
        };

        // --- TOAST NOTIFICATION FUNCTION ---
        function showToast(message, type = 'info') {
            let container = document.getElementById("toastContainer");
            if (!container) {
                container = document.createElement("div");
                container.id = "toastContainer";
                document.body.appendChild(container);
            }

            const toast = document.createElement("div");
            toast.className = `toast toast-${type}`;
            
            let icon = "ℹ️";
            if (type === "success") icon = "✅";
            if (type === "danger") icon = "🗑️";
            if (type === "warning") icon = "⚠️";

            toast.innerHTML = `<span>${icon}</span> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        function toggleLanguage() {
            currentLang = currentLang === "tl" ? "en" : "tl";
            localStorage.setItem("pos_lang", currentLang);
            applyLanguage();
            showToast(currentLang === "tl" ? "Pinalitan sa Tagalog" : "Switched to English", "info");
        }

        function applyLanguage() {
            let t = translations[currentLang];
            document.getElementById("htmlRoot").lang = currentLang;
            document.getElementById("langBtn").innerText = t.switchBtn;
            document.getElementById("lblHeaderTitle").innerText = t.headerTitle;
            document.getElementById("lblHeaderSub").innerText = t.headerSub;
            document.getElementById("lblRiceHeader").innerText = t.riceHeader;
            document.getElementById("btnAddRice").innerText = t.addRiceBtn;
            
            document.getElementById("thRiceName").innerText = t.thName;
            document.getElementById("thBought").innerText = t.thBought;
            document.getElementById("thCost").innerText = t.thCost;
            document.getElementById("thSold").innerText = t.thSold;
            document.getElementById("thPrice").innerText = t.thPrice;
            document.getElementById("thRemaining").innerText = t.thRem;
            document.getElementById("thTotCost").innerText = t.thTotCost;
            document.getElementById("thTotSales").innerText = t.thTotSales;
            document.getElementById("thProfitLoss").innerText = t.thProfit;
            document.getElementById("thStatus").innerText = t.thStatus;
            document.getElementById("thAction").innerText = t.thAction;

            document.getElementById("lblRiceSummaryTitle").innerText = t.riceSummaryTitle;
            document.getElementById("lblSumCost").innerText = t.sumCost;
            document.getElementById("lblSumSales").innerText = t.sumSales;
            document.getElementById("lblSumNet").innerText = t.sumNet;
            document.getElementById("btnDownloadRice").innerText = t.dlRice;
            document.getElementById("btnClearRice").innerText = t.clrRice;

            document.getElementById("lblGcashHeader").innerText = t.gcashHeader;
            document.getElementById("btnAddGcash").innerText = t.addGcashBtn;
            document.getElementById("lblCashInVol").innerText = t.cashInVol;
            document.getElementById("lblCashOutVol").innerText = t.cashOutVol;
            document.getElementById("lblGcashFeeSummary").innerText = t.gcashFeeSum;
            document.getElementById("lblHistoryHeader").innerText = t.historyHeader;

            document.getElementById("thTime").innerText = t.thTime;
            document.getElementById("thType").innerText = t.thType;
            document.getElementById("thGcAmt").innerText = t.thAmt;
            document.getElementById("thGcFee").innerText = t.thFee;
            document.getElementById("thGcRef").innerText = t.thRef;
            document.getElementById("btnDownloadGcash").innerText = t.dlGcash;

            document.getElementById("lblOverallHeader").innerText = t.overallHeader;
            document.getElementById("lblSplitRice").innerText = t.splitRice;
            document.getElementById("lblSplitGcash").innerText = t.splitGcash;
            document.getElementById("lblCombinedHeader").innerText = t.combinedHeader;
            document.getElementById("btnPrint").innerText = t.printRep;
            document.getElementById("btnReset").innerText = t.resetAll;

            document.querySelectorAll(".rice-name-input").forEach(input => {
                input.placeholder = t.placeholderName;
            });
            document.querySelectorAll(".delete-row-btn").forEach(btn => {
                btn.innerText = t.deleteBtn;
            });
        }

        let gcashCashInVol = 0;
        let gcashCashOutVol = 0;
        let gcashTotalFees = 0;
        let gcashTransactions = [];
        let processedRefNos = new Set();

        function loadRiceTable() {
            let savedData = localStorage.getItem("rice_pos_data_v5");
            let tbody = document.getElementById("riceTableBody");
            tbody.innerHTML = "";

            if (savedData) {
                try {
                    let listToUse = JSON.parse(savedData);
                    if (listToUse.length > 0) {
                        listToUse.forEach(item => {
                            appendRiceRow(item.name || "", item.binili || 0, item.puhunan || 0, item.nabenta || 0, item.presyo || 0);
                        });
                    } else {
                        appendRiceRow("", 0, 0, 0, 0);
                    }
                } catch(e) {
                    appendRiceRow("", 0, 0, 0, 0);
                }
            } else {
                appendRiceRow("", 0, 0, 0, 0);
            }
            applyLanguage();
            calculateAll();
        }

        function appendRiceRow(name, binili, puhunan, nabenta, presyo) {
            let t = translations[currentLang];
            let tbody = document.getElementById("riceTableBody");
            let row = document.createElement("tr");
            row.innerHTML = `
                <td style="text-align: left; padding-left: 6px;"><input type="text" class="rice-name-input" value="${name}" placeholder="${t.placeholderName}" style="text-align: left; font-weight: 700;"></td>
                <td><input type="number" class="binili" value="${binili}" min="0" oninput="calculateAll()"></td>
                <td><input type="number" class="puhunan" value="${puhunan}" min="0" oninput="calculateAll()"></td>
                <td><input type="number" class="nabenta" value="${nabenta}" min="0" oninput="calculateAll()"></td>
                <td><input type="number" class="presyo" value="${presyo}" min="0" oninput="calculateAll()"></td>
                <td class="natira">0</td>
                <td class="tot-puhunan">₱0</td>
                <td class="tot-benta">₱0</td>
                <td class="profit-loss">₱0</td>
                <td><span class="status-tag tag-even">EVEN</span></td>
                <td><button class="btn btn-danger delete-row-btn" style="padding: 3px 6px; font-size: 0.65rem;" onclick="deleteRiceRow(this)">${t.deleteBtn}</button></td>
            `;
            tbody.appendChild(row);
        }

        function addRiceRow() {
            appendRiceRow("", 0, 0, 0, 0);
            calculateAll();
            showToast(currentLang === "tl" ? "Bagong uri ng bigas naidagdag!" : "New rice variety added!", "success");
        }

        function deleteRiceRow(btn) {
            btn.closest("tr").remove();
            calculateAll();
            showToast(currentLang === "tl" ? "Nai-delete ang uri ng bigas!" : "Rice variety deleted!", "danger");
        }

        function calculateAutomaticFee(amount) {
            if (amount <= 0) return 0;
            if (amount < 1000) return 10;
            return Math.ceil(amount / 1000) * 20;
        }

        function calculateAll() {
            let rows = document.querySelectorAll("#riceTableBody tr");
            let totalPuhunanSum = 0;
            let totalBentaSum = 0;
            let totalProfitSum = 0;
            let riceDataToSave = [];

            rows.forEach((row) => {
                let nameFull = row.querySelector(".rice-name-input").value.trim();
                let binili = parseFloat(row.querySelector(".binili").value) || 0;
                let puhunanPerSako = parseFloat(row.querySelector(".puhunan").value) || 0;
                let nabenta = parseFloat(row.querySelector(".nabenta").value) || 0;
                let presyoBentaPerSako = parseFloat(row.querySelector(".presyo").value) || 0;

                let natira = binili - nabenta;
                let totalCostFullBatch = binili * puhunanPerSako;
                let totalSalesActual = nabenta * presyoBentaPerSako;
                let profit = totalSalesActual - totalCostFullBatch;

                row.querySelector(".natira").textContent = natira < 0 ? 0 : natira;
                row.querySelector(".tot-puhunan").textContent = "₱" + totalCostFullBatch.toLocaleString('en-US');
                row.querySelector(".tot-benta").textContent = "₱" + totalSalesActual.toLocaleString('en-US');

                let profitCell = row.querySelector(".profit-loss");
                let statusCell = row.cells[9]; 

                if (binili > 0 && puhunanPerSako > 0) {
                    if (profit > 0) {
                        profitCell.textContent = "+₱" + profit.toLocaleString('en-US');
                        profitCell.className = "profit-loss badge-positive";
                        statusCell.innerHTML = '<span class="status-tag tag-profit">PROFIT</span>';
                    } else if (profit < 0) {
                        profitCell.textContent = "-₱" + Math.abs(profit).toLocaleString('en-US');
                        profitCell.className = "profit-loss badge-negative";
                        statusCell.innerHTML = '<span class="status-tag tag-loss">LOSS</span>';
                    } else {
                        profitCell.textContent = "₱0";
                        profitCell.className = "profit-loss badge-neutral";
                        statusCell.innerHTML = '<span class="status-tag tag-even">EVEN</span>';
                    }
                } else {
                    profitCell.textContent = "₱0";
                    profitCell.className = "profit-loss badge-neutral";
                    statusCell.innerHTML = '<span class="status-tag tag-even">EVEN</span>';
                }

                totalPuhunanSum += totalCostFullBatch;
                totalBentaSum += totalSalesActual;
                totalProfitSum += profit;

                riceDataToSave.push({ name: nameFull, binili, puhunan: puhunanPerSako, nabenta, presyo: presyoBentaPerSako });
            });

            document.getElementById("summaryRiceCost").textContent = "₱" + totalPuhunanSum.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById("summaryRiceSales").textContent = "₱" + totalBentaSum.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            
            let riceProfitElem = document.getElementById("summaryRiceProfit");
            if(totalProfitSum > 0) {
                riceProfitElem.textContent = "+₱" + totalProfitSum.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                riceProfitElem.style.color = "#15803d";
            } else if(totalProfitSum < 0) {
                riceProfitElem.textContent = "-₱" + Math.abs(totalProfitSum).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                riceProfitElem.style.color = "#dc2626";
            } else {
                riceProfitElem.textContent = "₱0.00";
                riceProfitElem.style.color = "#64748b";
            }

            localStorage.setItem("rice_pos_data_v5", JSON.stringify(riceDataToSave));
            updateOverallSummary(totalProfitSum);
        }

        function addGCashEntry(type, amount, fee, refNo, isAuto = false) {
            let parsedAmount = parseFloat(amount) || 0;
            let parsedFee = parseFloat(fee);

            if (isNaN(parsedFee) || parsedFee === 0) {
                parsedFee = calculateAutomaticFee(parsedAmount);
            }

            if (type === "Cash In" || type === "CASH_IN" || type === "cashin") type = "Cash In";
            if (type === "Cash Out" || type === "CASH_OUT" || type === "cashout") type = "Cash Out";

            if (type === "Cash In") gcashCashInVol += parsedAmount;
            if (type === "Cash Out") gcashCashOutVol += parsedAmount;
            gcashTotalFees += parsedFee;

            document.getElementById("gcInVol").textContent = "₱" + gcashCashInVol.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById("gcOutVol").textContent = "₱" + gcashCashOutVol.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
            document.getElementById("gcFeeTotal").textContent = "₱" + gcashTotalFees.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

            let timeStr = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

            gcashTransactions.push({ time: timeStr, type, amount: parsedAmount, fee: parsedFee, refNo: refNo || 'N/A' });
            localStorage.setItem("gcash_pos_data_v5", JSON.stringify(gcashTransactions));

            let tbody = document.getElementById("gcLogTable");
            let newRow = document.createElement("tr");
            newRow.innerHTML = `
                <td>${timeStr}</td>
                <td><b>${type}</b></td>
                <td>₱${parsedAmount.toLocaleString('en-US')}</td>
                <td style="color: #2563eb; font-weight: 700;">₱${parsedFee.toLocaleString('en-US')}</td>
                <td><small style="color: #64748b;">${refNo || 'N/A'}</small></td>
            `;
            tbody.prepend(newRow);

            calculateAll();

            if(isAuto) {
                showToast(`📱 SMS Received: ${type} - ₱${parsedAmount}`, "success");
            } else {
                showToast(currentLang === "tl" ? "Naidagdag ang GCash transaction!" : "GCash transaction added!", "success");
            }
        }

        function manualAddGCash() {
            let type = document.getElementById("gcType").value;
            let amount = document.getElementById("gcAmount").value;
            let fee = document.getElementById("gcFee").value;
            let ref = document.getElementById("gcRef").value;

            if(!amount) return alert("Paki-type ang Amount / Please enter amount!");

            addGCashEntry(type, amount, fee, ref, false);

            document.getElementById("gcAmount").value = "";
            document.getElementById("gcFee").value = "";
            document.getElementById("gcRef").value = "";
        }

        function updateOverallSummary(riceProfit) {
            let splitRiceElem = document.getElementById("splitRiceVal");
            if (riceProfit > 0) {
                splitRiceElem.textContent = "+₱" + riceProfit.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                splitRiceElem.style.color = "#15803d";
            } else if (riceProfit < 0) {
                splitRiceElem.textContent = "-₱" + Math.abs(riceProfit).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                splitRiceElem.style.color = "#dc2626";
            } else {
                splitRiceElem.textContent = "₱0.00";
                splitRiceElem.style.color = "#64748b";
            }

            let splitGCashElem = document.getElementById("splitGCashVal");
            splitGCashElem.textContent = "+₱" + gcashTotalFees.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});

            let totalNetProfitCombined = riceProfit + gcashTotalFees;
            let overallElem = document.getElementById("overallProfit");
            
            if (totalNetProfitCombined > 0) {
                overallElem.textContent = "+₱" + totalNetProfitCombined.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                overallElem.style.color = "#34d399";
            } else if (totalNetProfitCombined < 0) {
                overallElem.textContent = "-₱" + Math.abs(totalNetProfitCombined).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
                overallElem.style.color = "#f87171";
            } else {
                overallElem.textContent = "₱0.00";
                overallElem.style.color = "#94a3b8";
            }
        }

        function listenToNodeServer() {
            fetch('http://192.168.1.3:3000/api/gcash')
                .then(res => res.json())
                .then(data => {
                    let badge = document.getElementById("smsStatusBadge");
                    if (badge) {
                        badge.innerText = "📱 Node.js Server: Connected (192.168.1.3)";
                        badge.style.backgroundColor = "rgba(34, 197, 94, 0.3)";
                    }
                    
                    let items = Array.isArray(data) ? data : [data];
                    
                    items.forEach(item => {
                        let refNo = item.refNo || item.ref_no || item.reference;
                        
                        if (refNo && !processedRefNos.has(refNo)) {
                            processedRefNos.add(refNo);
                            let type = item.type || "Cash In";
                            let amount = item.amount || 0;
                            let fee = item.fee || 0;
                            
                            addGCashEntry(type, amount, fee, refNo, true);
                        }
                    });
                })
                .catch(err => {
                    let badge = document.getElementById("smsStatusBadge");
                    if (badge) {
                        badge.innerText = "📱 Node.js Server: Waiting for SMS...";
                        badge.style.backgroundColor = "rgba(234, 179, 8, 0.3)";
                    }
                });
        }

        setInterval(listenToNodeServer, 3000);

        function clearRiceInputs() {
            if(confirm("Sigurado ka bang lilinisin ang mga numero? / Are you sure you want to clear numbers?")) {
                document.querySelectorAll("#riceTableBody tr").forEach(row => {
                    row.querySelectorAll("input[type='number']").forEach(input => input.value = 0);
                });
                calculateAll();
                showToast(currentLang === "tl" ? "Nalinis ang mga numero sa bigasan!" : "Cleared rice numbers!", "warning");
            }
        }

        function resetAllData() {
            if(confirm("⚠️ Sigurado ka bang i-re-reset ang LAHAT? / Reset all data?")) {
                localStorage.clear();
                showToast(currentLang === "tl" ? "Nareset na ang lahat ng datos!" : "All data reset!", "danger");
                setTimeout(() => {
                    location.reload();
                }, 1000);
            }
        }

        function exportRiceCSV() {
            let csv = "Uri ng Bigas,Binili (Sako),Puhunan/Sako,Nabenta (Sako),Presyo Benta/Sako,Natira,Total Puhunan,Total Benta,Profit/Loss,Status\n";
            document.querySelectorAll("#riceTableBody tr").forEach(row => {
                let name = row.querySelector(".rice-name-input").value;
                let binili = row.querySelector(".binili").value;
                let puhunan = row.querySelector(".puhunan").value;
                let nabenta = row.querySelector(".nabenta").value;
                let presyo = row.querySelector(".presyo").value;
                let natira = row.querySelector(".natira").innerText;
                let totPuh = row.querySelector(".tot-puhunan").innerText.replace(/[^0-9.-]+/g,"");
                let totBen = row.querySelector(".tot-benta").innerText.replace(/[^0-9.-]+/g,"");
                let prof = row.querySelector(".profit-loss").innerText.replace(/[^0-9.-]+/g,"");
                let status = row.cells[9].innerText;

                csv += `"${name}",${binili},${puhunan},${nabenta},${presyo},${natira},${totPuh},${totBen},${prof},${status}\n`;
            });
            let blob = new Blob([csv], { type: 'text/csv' });
            let url = window.URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'Bigasan_Inventory_Report.csv');
            a.click();
            showToast(currentLang === "tl" ? "Na-download ang Bigasan CSV!" : "Downloaded Bigasan CSV!", "info");
        }

        function exportGCashCSV() {
            let csv = "Oras,Type,Amount,Fee,Ref No.\n";
            gcashTransactions.forEach(tx => {
                csv += `"${tx.time}","${tx.type}",${tx.amount},${tx.fee},"${tx.refNo}"\n`;
            });
            let blob = new Blob([csv], { type: 'text/csv' });
            let url = window.URL.createObjectURL(blob);
            let a = document.createElement('a');
            a.setAttribute('href', url);
            a.setAttribute('download', 'GCash_Transactions_Report.csv');
            a.click();
            showToast(currentLang === "tl" ? "Na-download ang GCash CSV!" : "Downloaded GCash CSV!", "info");
        }

        window.onload = function() {
            loadRiceTable();
        }
    </script>
