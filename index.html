<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart POS & Store Tracker</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --danger-color: #c0392b;
            --bg-color: #f4f6f7;
            --card-bg: #ffffff;
            --text-color: #333333;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            background: var(--primary-color);
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
        }

        h1, h3 {
            margin: 0;
        }

        .card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
            min-width: 600px;
        }

        th, td {
            padding: 10px;
            text-align: left;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #f8f9fa;
        }

        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 6px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            padding: 8px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }

        .btn-add {
            background-color: var(--accent-color);
            color: white;
            margin-bottom: 10px;
        }

        .btn-delete {
            background-color: var(--danger-color);
            color: white;
            padding: 5px 10px;
        }

        .summary-box {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
        }

        .summary-card {
            flex: 1;
            background: #eef2f3;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
        }

        .summary-card h4 {
            margin: 0 0 5px 0;
            color: #555;
        }

        .summary-card p {
            font-size: 1.2em;
            font-weight: bold;
            margin: 0;
            color: var(--accent-color);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Smart POS & Store Tracker</h1>
        <button onclick="resetAll()" style="background-color: #e74c3c; color: white;">Reset All</button>
    </header>

    <!-- Rice Inventory Section -->
    <div class="card">
        <h3>Rice Inventory & Sales</h3>
        <button onclick="addNewRiceRow()" class="btn-add">+ Add Rice Variety</button>
        
        <table id="riceTable">
            <thead>
                <tr>
                    <th>Rice Variety</th>
                    <th>Sacks Bought</th>
                    <th>Cost/Sack</th>
                    <th>Sell Price/Sack</th>
                    <th>Sacks Sold</th>
                    <th>Remaining</th>
                    <th>Revenue</th>
                    <th>Profit</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="riceTableBody">
                <!-- Default Row 1 -->
                <tr>
                    <td><input type="text" class="rice-name" value="Sinandomeng"></td>
                    <td><input type="number" class="sacks-bought" value="10" oninput="calculateRice()"></td>
                    <td><input type="number" class="cost-sack" value="2000" oninput="calculateRice()"></td>
                    <td><input type="number" class="sell-sack" value="2300" oninput="calculateRice()"></td>
                    <td><input type="number" class="sacks-sold" value="4" oninput="calculateRice()"></td>
                    <td class="sacks-remaining">6</td>
                    <td class="rice-revenue">₱9,200.00</td>
                    <td class="rice-profit">₱1,200.00</td>
                    <td><button onclick="deleteRiceRow(this)" class="btn-delete">Delete</button></td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Summary Section -->
    <div class="card">
        <h3>Store Summary</h3>
        <div class="summary-box">
            <div class="summary-card">
                <h4>Total Revenue</h4>
                <p id="totalRevenueDisplay">₱0.00</p>
            </div>
            <div class="summary-card">
                <h4>Total Net Profit</h4>
                <p id="totalProfitDisplay">₱0.00</p>
            </div>
        </div>
    </div>
</div>

<script>
    function addNewRiceRow() {
        const tbody = document.getElementById('riceTableBody');
        const newRow = document.createElement('tr');
        
        newRow.innerHTML = `
            <td><input type="text" class="rice-name" placeholder="Enter brand name" value="New Brand"></td>
            <td><input type="number" class="sacks-bought" value="0" oninput="calculateRice()"></td>
            <td><input type="number" class="cost-sack" value="0" oninput="calculateRice()"></td>
            <td><input type="number" class="sell-sack" value="0" oninput="calculateRice()"></td>
            <td><input type="number" class="sacks-sold" value="0" oninput="calculateRice()"></td>
            <td class="sacks-remaining">0</td>
            <td class="rice-revenue">₱0.00</td>
            <td class="rice-profit">₱0.00</td>
            <td><button onclick="deleteRiceRow(this)" class="btn-delete">Delete</button></td>
        `;
        
        tbody.appendChild(newRow);
        calculateRice();
    }

    function deleteRiceRow(button) {
        const row = button.closest('tr');
        row.remove();
        calculateRice();
    }

    function calculateRice() {
        const rows = document.querySelectorAll('#riceTableBody tr');
        let grandTotalRevenue = 0;
        let grandTotalProfit = 0;

        rows.forEach(row => {
            const bought = parseFloat(row.querySelector('.sacks-bought').value) || 0;
            const cost = parseFloat(row.querySelector('.cost-sack').value) || 0;
            const sell = parseFloat(row.querySelector('.sell-sack').value) || 0;
            const sold = parseFloat(row.querySelector('.sacks-sold').value) || 0;

            const remaining = bought - sold;
            const revenue = sold * sell;
            const profit = revenue - (sold * cost);

            grandTotalRevenue += revenue;
            grandTotalProfit += profit;

            row.querySelector('.sacks-remaining').textContent = remaining;
            row.querySelector('.rice-revenue').textContent = `₱${revenue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
            row.querySelector('.rice-profit').textContent = `₱${profit.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        });

        document.getElementById('totalRevenueDisplay').textContent = `₱${grandTotalRevenue.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
        document.getElementById('totalProfitDisplay').textContent = `₱${grandTotalProfit.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
    }

    function resetAll() {
        if(confirm("Are you sure you want to reset the table?")) {
            document.getElementById('riceTableBody').innerHTML = '';
            addNewRiceRow();
        }
    }

    // Run initial calculation on load
    window.onload = calculateRice;
</script>

</body>
</html>
